<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koneksi terputus — E-Fulfill Hub</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; }
    main { width: min(100%, 420px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 10px 25px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 20px; color: #475569; line-height: 1.6; }
    button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #ee4d2d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Koneksi sedang terputus</h1>
    <p>Pesanan dan stok tidak disimpan dari perangkat ini. Sambungkan internet lalu coba lagi agar data tetap akurat.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
