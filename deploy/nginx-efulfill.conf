# Konfigurasi Nginx untuk E-Fulf Hub.
# Ganti __HOST__ dengan domain/IP publik Anda sebelum dipakai.
#
# Pasang di: /etc/nginx/sites-available/efulfill
# Aktifkan : ln -s /etc/nginx/sites-available/efulfill /etc/nginx/sites-enabled/efulfill

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # Unggahan (impor berkas/gambar produk) — batas aman.
    client_max_body_size 25m;

    # Keamanan dasar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pembaruan langsung (Server-Sent Events) di /api/v1/events/stream:
        # koneksinya harus dibiarkan terbuka lama dan penyangga dimatikan,
        # kalau tidak, notifikasi realtime tidak akan sampai ke layar.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
